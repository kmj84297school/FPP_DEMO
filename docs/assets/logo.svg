<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="FPP 로고 — 별과 두 궤도">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19ffa7"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- 닫힌 궤도(현재) -->
  <ellipse cx="60" cy="60" rx="50" ry="20" transform="rotate(-28 60 60)" fill="none" stroke="url(#lg)" stroke-width="6" stroke-linecap="round"/>
  <!-- 열린 궤도(미래) — 'P'의 열린 획을 암시 -->
  <ellipse cx="60" cy="60" rx="50" ry="20" transform="rotate(40 60 60)" fill="none" stroke="url(#lg)" stroke-width="6" stroke-linecap="round" stroke-dasharray="380 120"/>
  <!-- 별(잠재력) -->
  <path d="M60 36 L66 54 L84 60 L66 66 L60 84 L54 66 L36 60 L54 54 Z" fill="#19ffa7"/>
  <!-- 궤도 위의 두 점: 현재(초록), 2~3년 후(보라) -->
  <circle cx="17" cy="82" r="5" fill="#19ffa7"/>
  <circle cx="98" cy="22" r="5" fill="#a78bfa"/>
</svg>
